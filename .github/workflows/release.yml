name: release

# Tag convention matches `claude plugin tag`, which validates plugin.json against
# the marketplace entry before creating cprof--v<version>.
#
# Two ways in, one path through: pushing a tag by hand, or tag.yml calling this
# after a version bump lands on main. `inputs.tag` is empty for the push event,
# so both resolve to the same tag name.
on:
  push:
    tags: ['cprof--v*']
  workflow_call:
    inputs:
      tag:
        description: The cprof--v<version> tag to release.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}

      - name: version from tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${TAG#cprof--v}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the manifests would publish a release nobody can
      # install: the marketplace serves whatever the manifest claims.
      - name: tag matches the manifests
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          market=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          entry=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          for got in "$plugin" "$market" "$entry"; do
            if [ "$got" != "$VERSION" ]; then
              printf 'tag says %s, manifest says %s\n' "$VERSION" "$got" >&2
              exit 1
            fi
          done
          printf 'version %s agrees across manifests\n' "$VERSION"

      # No shellcheck here: ci.yml lints every push to main with a pinned
      # version, so a tag already points at a linted commit. Installing it from
      # brew would also unpin the version this repo checks against.
      - name: suite
        run: bash tests/run.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.tag }}

      - name: notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 == "## [" v "]" { inside = 1; next }
            inside && /^## \[/  { exit }
            inside              { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            printf 'CHANGELOG.md has no section for %s\n' "$VERSION" >&2
            exit 1
          fi
          cat notes.md

      # OSPS-BR-06.01: every release asset is accounted for in a hash manifest.
      # The tarball is built here rather than trusting the auto-generated one,
      # whose bytes GitHub does not guarantee stable over time.
      - name: tarball and checksums
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="cprof-$VERSION/" \
            -o "cprof-$VERSION.tar.gz" HEAD
          sha256sum "cprof-$VERSION.tar.gz" > checksums.txt
          cat checksums.txt

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "cprof $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            "cprof-$VERSION.tar.gz" checksums.txt

      # Tell the tap a release exists so it bumps the formula now rather than
      # on its next scheduled run. github.token cannot reach another
      # repository, hence a separate secret scoped to contents:write on the tap
      # and nothing else.
      #
      # Never fails the release. The tap polls daily as a backstop, so a
      # dispatch that does not land costs latency, not correctness — and a
      # published release that reports failure because a downstream notification
      # bounced would be the worse outcome.
      - name: tell the tap to bump the formula
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'TAP_DISPATCH_TOKEN is unset; the tap will pick this up on its daily run' >&2
            exit 0
          fi
          gh api repos/dcotelo/homebrew-tap/dispatches \
            -f event_type=cprof-released \
            -F "client_payload[tag]=$TAG"
          printf 'dispatched cprof-released for %s\n' "$TAG"
