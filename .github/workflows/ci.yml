name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Pinned, not the version on the runner image: a newer shellcheck locally
      # than in CI means findings appear only after a push. Bump deliberately.
      SHELLCHECK_VERSION: '0.11.0'
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sc="shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$sc" --version
          "$sc" -x -P scripts -P tests \
            scripts/cprof scripts/lib/*.sh hooks/*.sh statusline/*.sh tests/*.sh

  test:
    # macOS on purpose: the target shell is bash 3.2, the system shell there, and
    # the code is written against it. Ubuntu's bash 5 would hide a regression.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell version
        run: /bin/bash --version | head -1
      - name: suite
        run: bash tests/run.sh

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifests parse and agree
        run: bash tests/test_manifest.sh
      - name: plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
