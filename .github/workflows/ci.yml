name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # shellcheck ships on the Ubuntu image; the shell under test does not have to
    # match for a static check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x -P scripts -P tests \
            scripts/claudeprofile scripts/lib/*.sh hooks/*.sh statusline/*.sh tests/*.sh

  test:
    # macOS on purpose: the target shell is bash 3.2, the system shell there, and
    # the code is written against it. Ubuntu's bash 5 would hide a regression.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell version
        run: /bin/bash --version | head -1
      - name: suite
        run: bash tests/run.sh

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifests parse and agree
        run: bash tests/test_manifest.sh
      - name: plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
